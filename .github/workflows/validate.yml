name: Validate & package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate repository
        run: |
          node tests/validate.mjs
          node tests/core.mjs

      - name: Lint Firefox extension
        run: npx --yes web-ext lint --source-dir extension

      - name: Package extension
        run: python3 scripts/package.py

      - name: Upload unsigned build artifact
        uses: actions/upload-artifact@v4
        with:
          name: expensium-unsigned
          path: dist/*.zip
          if-no-files-found: error
