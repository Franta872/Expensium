name: Bootstrap repository

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand repository payload
        run: |
          cat bootstrap.part* > all.b64
          base64 -d all.b64 > source.zip
          unzip -o source.zip
          rm -f all.b64 source.zip bootstrap.b64 bootstrap.part*
          rm -f .github/workflows/bootstrap.yml

      - name: Commit expanded repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Expensium source and GitHub automation"
          git push
