changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: "🚀 Features"
      labels: [enhancement, feature]
    - title: "🐛 Fixes"
      labels: [bug]
    - title: "🌍 Languages"
      labels: [translation]
    - title: "🧰 Maintenance"
      labels: [dependencies, documentation]
    - title: "Other changes"
      labels: ["*"]
