<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Expensium</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header class="top">
      <img src="icons/icon.svg" class="logo" alt="">
      <div class="brand">
        <strong>Expensium</strong>
        <span id="variant">Adium / Expensium</span>
      </div>
      <button id="toggle" class="toggle" type="button" role="switch" aria-checked="true">
        <span class="toggleKnob"></span>
      </button>
    </header>

    <div class="modeRow" role="radiogroup">
      <button type="button" data-mode="auto" class="modeButton selected">Auto</button>
      <button type="button" data-mode="standard" class="modeButton">Standard</button>
      <button type="button" data-mode="premium" class="modeButton">Premium</button>
    </div>

    <div class="searchRow">
      <span aria-hidden="true">⌕</span>
      <input id="search" type="search" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </div>

    <div id="list" class="list" role="listbox" tabindex="0"></div>

    <footer>
      <span id="count"></span>
      <span title="Local only">🔒</span>
    </footer>
  </main>

  <script src="languages.js"></script>
  <script src="core.js"></script>
  <script src="ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
